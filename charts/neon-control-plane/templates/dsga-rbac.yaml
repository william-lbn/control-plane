{{- /* DSGA 运行时跨命名空间权限只在显式打开新 Compute 创建时授予。 */ -}}
{{- if .Values.dsga.createEnabled -}}
{{- $name := include "neonControl.name" . -}}
{{- $apiAccount := printf "%s-api" $name -}}
{{- /* 兼容单进程模式：API 同时承担 Worker 时必须继承同一组受限权限。 */ -}}
{{- $workerAccount := ternary (printf "%s-worker" $name) $apiAccount .Values.worker.enabled -}}
{{- $accessPrefix := required "dsga.runtimeAccessRolePrefix is required" .Values.dsga.runtimeAccessRolePrefix -}}
{{- $platformNamespace := required "dsga.runtimeSelectionNamespace is required" .Values.dsga.runtimeSelectionNamespace -}}
{{- $agentNamespace := required "dsga.agentNamespace is required" .Values.dsga.agentNamespace -}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-dsga-neon-api" $name | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "neonControl.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-api" $accessPrefix }}
subjects:
  - kind: ServiceAccount
    name: {{ $apiAccount }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-dsga-neon-worker" $name | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "neonControl.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-worker" $accessPrefix }}
subjects:
  - kind: ServiceAccount
    name: {{ $workerAccount }}
    namespace: {{ .Release.Namespace }}
---
# Qualification recovery must detect already-published immutable claims for the
# original VM. Only the Worker can list ConfigMaps in the runtime namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "%s-dsga-qualification-lookup" $name | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "neonControl.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-dsga-qualification-lookup" $name | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "neonControl.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-dsga-qualification-lookup" $name | trunc 63 | trimSuffix "-" }}
subjects:
  - kind: ServiceAccount
    name: {{ $workerAccount }}
    namespace: {{ .Release.Namespace }}
---
# API 只更新由原 Compute/VMUID 命名的 Runtime Selection ConfigMap。
# 初始 ConfigMap 与 Qualification Job 的创建由 Worker 的平台角色完成。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "%s-dsga-platform-policy" $name | trunc 63 | trimSuffix "-" }}
  namespace: {{ $platformNamespace }}
  labels:
    {{- include "neonControl.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-dsga-platform-policy" $name | trunc 63 | trimSuffix "-" }}
  namespace: {{ $platformNamespace }}
  labels:
    {{- include "neonControl.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-dsga-platform-policy" $name | trunc 63 | trimSuffix "-" }}
subjects:
  - kind: ServiceAccount
    name: {{ $apiAccount }}
    namespace: {{ .Release.Namespace }}
---
# Worker 负责发布本次 VM 身份绑定的 Collector ConfigMap、Qualification Job，
# 并读取 Job Pod 状态与日志；权限复用平台 Runtime Access 的窄命名空间角色。
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-dsga-platform-worker" $name | trunc 63 | trimSuffix "-" }}
  namespace: {{ $platformNamespace }}
  labels:
    {{- include "neonControl.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-platform-worker" $accessPrefix }}
subjects:
  - kind: ServiceAccount
    name: {{ $workerAccount }}
    namespace: {{ .Release.Namespace }}
---
# API 读取当前策略，Worker 确认原策略已采用。两者共用指定 Agent 的只读观察权限。
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-dsga-agent-observation" $name | trunc 63 | trimSuffix "-" }}
  namespace: {{ $agentNamespace }}
  labels:
    {{- include "neonControl.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-agent-observation" $accessPrefix }}
subjects:
{{- range $account := list $apiAccount $workerAccount | uniq }}
  - kind: ServiceAccount
    name: {{ $account }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
---
# Worker 只读取固定节点清单中的 Node UID；不授予 Node list/watch/update。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-dsga-node-read" $name | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "neonControl.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.dsga.nodeReadClusterRole }}
subjects:
  - kind: ServiceAccount
    name: {{ $workerAccount }}
    namespace: {{ .Release.Namespace }}
---
# Worker 只能创建其已有权限范围内的 Runner ClusterRoleBinding；Runner 最终绑定的
# ClusterRole 仍由 dsgaSupplyAccess 固定为发行目录中的 node-read 角色。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-dsga-runner-delegation" $name | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "neonControl.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-runner-delegation" $accessPrefix }}
subjects:
  - kind: ServiceAccount
    name: {{ $workerAccount }}
    namespace: {{ .Release.Namespace }}
{{- end -}}
