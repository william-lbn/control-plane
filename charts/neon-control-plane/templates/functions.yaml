{{- if .Values.functions.enabled -}}
{{- if or (not .Values.worker.enabled) (not .Values.objectStorage.enabled) -}}
{{- fail "Functions preview requires separate Worker and configured product Object Storage" -}}
{{- end -}}
{{- if or (ne (int .Values.worker.replicaCount) 1) (ne (int .Values.api.replicaCount) 1) -}}
{{- fail "Functions preview requires one API and one Worker until external execution fencing is admitted" -}}
{{- end -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "neonControl.name" . }}-functions-artifact
  labels:
    {{- include "neonControl.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: worker}
  # Private TLS, original-instance HMAC and immutable artifact digest validation.
  ports: [{name: artifact-tls, port: 8790, targetPort: artifact-tls}]
{{- end }}
