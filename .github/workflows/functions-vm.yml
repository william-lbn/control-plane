name: Build isolated Functions VM
on:
  workflow_dispatch:
    inputs:
      quality_run_id:
        description: Successful Linux quality and images run for this exact commit
        required: true
        type: string
permissions: {contents: read}
concurrency:
  group: functions-vm-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions: {contents: read, actions: read, packages: write}
    env:
      FUNCTIONS_SOURCE_COMMIT: ${{ github.sha }}
      QUALITY_RUN_ID: ${{ inputs.quality_run_id }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24.19.0'}
      - name: Exact source quality admission
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          [[ "$GITHUB_REF" == refs/heads/main && "$QUALITY_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALITY_RUN_ID" > "$RUNNER_TEMP/quality-run.json"
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const r = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/quality-run.json'));
          if (r.head_sha !== process.env.GITHUB_SHA || r.conclusion !== 'success' || r.name !== 'Linux quality and images' || r.event !== 'push' || r.head_branch !== 'main') throw Error('Exact source quality admission rejected');
          NODE
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Prepare disposable Linux build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-utils e2fsprogs
      - run: bash tools/build-functions-vm.sh
      - name: Immutable publication names
        id: names
        run: |
          task_tag="sha-$GITHUB_SHA-r$GITHUB_RUN_ID-a$GITHUB_RUN_ATTEMPT"
          task_tags="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/control-functions-vm:$task_tag"
          if [[ -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]]; then
            task_tags="$task_tags"$'\n'"docker.io/$DOCKERHUB_USERNAME/control-functions-vm:$task_tag"
          fi
          { echo 'tags<<TAGS'; printf '%s\n' "$task_tags"; echo TAGS; } >> "$GITHUB_OUTPUT"
          node tools/build-args.mjs >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        with: {username: '${{ secrets.DOCKERHUB_USERNAME }}', password: '${{ secrets.DOCKERHUB_TOKEN }}'}
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        id: image
        with:
          context: .
          file: Dockerfile.functions-vm
          platforms: linux/amd64
          push: true
          tags: ${{ steps.names.outputs.tags }}
          build-args: NODE_BUILDER_IMAGE=${{ steps.names.outputs.NODE_BUILDER_IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
            io.neon.functions.contract=isolated-neonvm-functions-v1
          sbom: true
          provenance: mode=max
      - name: Publication receipt
        env: {DIGEST: '${{ steps.image.outputs.digest }}', TAGS: '${{ steps.names.outputs.tags }}'}
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          fs.writeFileSync('artifacts/functions-vm/image.json', JSON.stringify({component:'functions-vm',commit:process.env.GITHUB_SHA,digest:process.env.DIGEST,tags:process.env.TAGS.split('\n'),platform:'linux/amd64',quality_run_id:process.env.QUALITY_RUN_ID,microvm_acceptance:false},null,2)+'\n');
          NODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: functions-vm-receipt
          path: |
            artifacts/functions-vm/image.json
            artifacts/functions-vm/SHA256SUMS
            artifacts/functions-vm/disk-info.json
            artifacts/functions-vm/source-commit.txt
            artifacts/functions-vm/guest-packages.txt
            artifacts/functions-vm/inittab.actual
          retention-days: 90
