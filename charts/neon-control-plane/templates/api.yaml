{{- if and .Values.sqlHistory.enabled (not .Values.backendCredentials.enabled) }}
{{- fail "sqlHistory requires backendCredentials.enabled and a retained versioned encryption keyring" }}
{{- end }}
{{- $name := include "neonControl.name" . -}}
{{- if and .Values.consoleSSO.enabled (not .Values.backendCredentials.enabled) }}
{{- fail "consoleSSO requires backendCredentials.enabled and retained versioned encryption keys" }}
{{- end }}
{{- if and .Values.aiProviderManagement.enabled (not (and .Values.aiGateway.enabled .Values.backendCredentials.enabled .Values.worker.enabled)) }}
{{- fail "aiProviderManagement requires AI Gateway, versioned Backend keys and separated Worker" }}
{{- end }}
{{- if and .Values.backendCredentials.enabled (not .Values.api.cookieSecure) (not .Values.backendCredentials.labHTTP) -}}
{{- fail "Backend credentials require secure cookies or explicit backendCredentials.labHTTP laboratory override" -}}
{{- end -}}
{{- if and (eq .Values.api.pgTLSMode "verify-full") (not .Values.api.pgCASecret) -}}
{{- fail "verify-full requires api.pgCASecret containing ca.crt; use lab-insecure only in an explicit laboratory override" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-api
  labels:
    {{- include "neonControl.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  revisionHistoryLimit: 5
  # An overlapping worker cannot be allowed before the distributed fence gate.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: api
        {{- include "neonControl.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}-api
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      terminationGracePeriodSeconds: 35
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: {{ required "api.image.reference is required" .Values.api.image.reference | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          ports:
            - {name: http, containerPort: 8788}
            {{- if and .Values.objectStorage.enabled .Values.objectStorage.s3.enabled }}
            - {name: s3, containerPort: 8793}
            {{- end }}
            {{- if and .Values.functions.enabled .Values.functions.publicHTTP.enabled }}
            - {name: functions-http, containerPort: 8792}
            {{- end }}
          resources: {{ toYaml .Values.api.resources | nindent 12 }}
          env:
            {{- include "neonControl.providerEnv" (dict "root" . "private" false) | nindent 12 }}
            - {name: NEON_CONTROL_PROCESS_ROLE, value: {{ ternary "api" "all" .Values.worker.enabled | quote }}}
            - {name: NEON_V2_BIND, value: ':8788'}
            - {name: NEON_V2_SQL_HISTORY_ENABLED, value: {{ .Values.sqlHistory.enabled | quote }}}
            - {name: NEON_V2_ADMIN_PASSWORD_FILE, value: /run/neon-secrets/admin-password}
            {{- if .Values.platformManagement.enabled }}
            - {name: NEON_PLATFORM_POLICY_FILE, value: /run/platform-policy/config.json}
            {{- end }}
            {{- if .Values.consoleSSO.enabled }}
            - {name: NEON_CONSOLE_OIDC_CONFIG_FILE, value: /run/console-oidc/config.json}
            {{- end }}
            {{- if .Values.objectStorage.enabled }}
            - {name: NEON_STORAGE_BUFFER_DIR, value: /run/object-buffer}
            {{- end }}
            {{- if .Values.aiGateway.enabled }}
            - {name: NEON_AI_CONFIG_FILE, value: /run/ai-config/config.json}
            - {name: NEON_AI_GATEWAY_URL, value: 'http://{{ $name }}-ai:8791'}
            {{- end }}
            {{- if .Values.backendCredentials.enabled }}
            - {name: NEON_BACKEND_CREDENTIAL_KEYS_FILE, value: /run/backend-keys/keyring.json}
            {{- end }}
            {{- include "neonControl.runtimeEnv" . | nindent 12 }}
          volumeMounts:
            {{- if .Values.platformManagement.enabled }}
            - {name: platform-policy, mountPath: /run/platform-policy, readOnly: true}
            {{- end }}
            {{- if .Values.consoleSSO.enabled }}
            - {name: console-oidc, mountPath: /run/console-oidc, readOnly: true}
            {{- end }}
            {{- include "neonControl.providerMounts" (dict "root" . "private" false) | nindent 12 }}
            {{- if .Values.aiGateway.enabled }}
            - {name: ai-config, mountPath: /run/ai-config, readOnly: true}
            {{- end }}
            {{- include "neonControl.functionsMounts" . | nindent 12 }}
            {{- if .Values.objectStorage.enabled }}
            - {name: product-storage, mountPath: /run/product-storage, readOnly: true}
            - {name: product-storage-buffer, mountPath: /run/object-buffer}
            {{- end }}
            - {name: credentials, mountPath: /run/neon-secrets, readOnly: true}
            {{- if .Values.backendCredentials.enabled }}
            - {name: backend-keys, mountPath: /run/backend-keys, readOnly: true}
            {{- end }}
            {{- if .Values.api.pgCASecret }}
            - {name: pg-ca, mountPath: /run/pg-ca, readOnly: true}
            {{- end }}
          startupProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5, timeoutSeconds: 4, failureThreshold: 60}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 10, timeoutSeconds: 4, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 15, timeoutSeconds: 3, failureThreshold: 3}
      volumes:
        {{- if .Values.platformManagement.enabled }}
        - name: platform-policy
          configMap:
            name: {{ include "neonControl.platformPolicyName" . }}
            defaultMode: 0444
            items: [{key: config.json, path: config.json}]
        {{- end }}
        {{- if .Values.consoleSSO.enabled }}
        - name: console-oidc
          secret:
            secretName: {{ required "consoleSSO.existingSecret required" .Values.consoleSSO.existingSecret }}
            defaultMode: 0440
            items: [{key: config.json, path: config.json}]
        {{- end }}
        {{- include "neonControl.providerVolumes" (dict "root" . "private" false) | nindent 8 }}
        {{- if .Values.aiGateway.enabled }}
        - name: ai-config
          secret:
            secretName: {{ .Values.aiGateway.existingConfigSecret }}
            defaultMode: 0440
            items: [{key: config.json, path: config.json}]
        {{- end }}
        {{- include "neonControl.functionsVolumes" . | nindent 8 }}
        {{- if .Values.objectStorage.enabled }}
        - name: product-storage
          secret:
            secretName: {{ required "objectStorage.existingSecret is required" .Values.objectStorage.existingSecret }}
            defaultMode: 0440
            items: [{key: config.json, path: config.json}]
        - name: product-storage-buffer
          emptyDir: {sizeLimit: 256Mi}
        {{- end }}
        - name: credentials
          secret: {secretName: {{ .Values.api.existingSecret }}, defaultMode: 0440}
        {{- if .Values.backendCredentials.enabled }}
        - name: backend-keys
          secret:
            secretName: {{ required "backendCredentials.existingSecret is required" .Values.backendCredentials.existingSecret }}
            defaultMode: 0440
            items: [{key: keyring.json, path: keyring.json}]
        {{- end }}
        {{- if .Values.api.pgCASecret }}
        - name: pg-ca
          secret: {secretName: {{ .Values.api.pgCASecret }}, defaultMode: 0440}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-api
spec:
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api}
  ports: [{name: http, port: 8788, targetPort: http}]
{{- if and .Values.objectStorage.enabled .Values.objectStorage.s3.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-s3
  labels:
    {{- include "neonControl.labels" . | nindent 4 }}
spec:
  type: {{ .Values.objectStorage.s3.serviceType }}
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api}
  ports:
    - name: s3
      port: 8793
      targetPort: s3
      {{- if eq .Values.objectStorage.s3.serviceType "NodePort" }}
      nodePort: {{ .Values.objectStorage.s3.nodePort }}
      {{- end }}
{{- end }}
{{- if and .Values.functions.enabled .Values.functions.publicHTTP.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-functions-http
  labels:
    {{- include "neonControl.labels" . | nindent 4 }}
spec:
  type: {{ .Values.functions.publicHTTP.serviceType }}
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api}
  ports:
    - name: functions-http
      port: 8792
      targetPort: functions-http
      {{- if eq .Values.functions.publicHTTP.serviceType "NodePort" }}
      nodePort: {{ .Values.functions.publicHTTP.nodePort }}
      {{- end }}
{{- end }}
