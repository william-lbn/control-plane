# Product object bytes require an operator-provisioned dedicated S3 bucket.
# config.json holds endpoint/bucket/region/access_key/secret_key/lab_http.
# Use a bucket-restricted credential, never the MinIO root or Pageserver identity.
objectStorage:
  enabled: false
  existingSecret: ''
  # Core S3 protocol preview: application credentials, never MinIO root keys.
  s3:
    enabled: false
    origin: ''
    region: us-east-2
    labHTTP: false
    serviceType: ClusterIP
    nodePort: 30893

fullnameOverride: neon-control
# Independent inference process. It has no Kubernetes service-account token.
# config.json is an operator-approved immutable route snapshot; provider keys
# are mounted only in the gateway, never in the Console or API projection.
aiGateway:
  enabled: false
  image: ''
  existingConfigSecret: ''
  existingDatabaseSecret: ''
  labHTTP: false
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
# Native Functions preview uses private TLS between the Worker and microVM.
# Config/MAC/public certificates are separate from Worker-only issuer keys.
# Existing Secrets are operator-managed and are retained across Helm upgrades.
functions:
  enabled: false
  objectEvents:
    enabled: false
  outputLogs:
    enabled: false
  branchCopies:
    enabled: false
  managerCertificateRenewal:
    enabled: false
    # Refresh a two-hour leaf before expiry, without replacing the Guest boot.
    renewBeforeSeconds: 2700
  # Requires an upgraded Guest supervisor with signed trigger invocation support.
  # Off by default. Persistent UTC plans remain inspectable while disabled.
  schedules:
    enabled: false
  # Dedicated web origin. Never proxy customer responses through Console nginx.
  # With a shared lab host, Cookie/Set-Cookie are suppressed in both directions.
  publicHTTP:
    enabled: false
    origin: ''
    labHTTP: false
    serviceType: ClusterIP
    nodePort: 30892
  existingConfigSecret: ''
  existingIssuerSecret: ''
  proxyCASecret: ''
  proxyCAKey: ca.crt
managedAuth:
  enabled: false
  # SMTP operator identity is external and immutable. It is mounted only into
  # branch Auth runtimes; never into Web or metadata responses.
  mail:
    enabled: false
    existingSecret: ''
  # Local acceptance receiver, never a substitute for external mail delivery.
  # Its credentials and retained message store are independent of Auth SMTP.
  labMailbox:
    # Optional test receiver placement; does not move production API/Worker.
    nodeSelector: {}
    enabled: false
    acknowledged: false
    image: docker.io/axllent/mailpit@sha256:eee7db19e7518ffe47d9b38e46fab655a4edf7e6cb5e664d1b5fde6c9dc49010
    existingAuthSecret: ''
    existingClaim: ''
    storageClass: ''
    storageSize: 512Mi
  # Version 1 requires the explicit lab HTTP profile. It is not a trusted TLS gate.
  labHTTP: false
  runtimeImage: ''
  # Exact browser-facing origin; no path, trailing slash, wildcard or credentials.
  publicOrigin: ''
  # Public CA certificate only; never project the Proxy private key.
  pgCASecret: ''
  pgCAKey: ca.crt
  # Exact certificate DNS identity, independent of the connection/service DNS.
  pgServerName: ''
backendCredentials:
  enabled: false
  existingSecret: ''
  labHTTP: false
dataAPI:
  enabled: false
  # Native Driver v1 requires this explicit development transport exception.
  # It does not satisfy the trusted TLS production gate.
  labHTTP: false
  gatewayImage: ''
  postgrestImage: ''
worker:
  # Upgrade from combined mode requires the documented stop/drain procedure.
  enabled: true
  replicaCount: 1
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: '1', memory: 512Mi}
api:
  # Multiple APIs still require external connection fencing and a separate gate.
  replicaCount: 1
  image: {reference: '', pullPolicy: IfNotPresent}
  existingSecret: neon-control-plane-credentials
  creationEnabled: true
  # Historical restore creates a new branch; source Endpoints are never rewound.
  pitrEnabled: false
  scaleToZeroEnabled: true
  cookieSecure: true
  proxyHost: proxy.neon.svc.cluster.local
  proxyPort: 4432
  publicProxyHost: ''
  publicProxyPort: 5432
  pgTLSMode: verify-full
  pgCASecret: ''
  computeGatewayURL: https://neon-compute-management-gateway.neon.svc:8443
  computeControlHost: neon-compute-management-gateway.neon.svc
  computeImage: docker.io/williamluckyli/vm-compute-node-v16@sha256:4716bf4c0d5437b05977787398b764b5638ab42bbc657dcc6909fd39c095744d
  resources:
    requests: {cpu: 150m, memory: 128Mi}
    limits: {cpu: '1', memory: 512Mi}
web:
  replicaCount: 1
  image: {reference: '', pullPolicy: IfNotPresent}
  resources:
    requests: {cpu: 50m, memory: 32Mi}
    limits: {cpu: 250m, memory: 128Mi}
service: {type: ClusterIP, port: 8080, nodePort: 30788}
imagePullSecrets: []
nodeSelector: {}
tolerations: []
priorityClassName: ''
ingress:
  enabled: false
  className: traefik
  host: ''
  annotations: {}
  tls: []

# SQL text may contain sensitive literals. Explicit operator opt-in; encrypted
# personal history never records connection passwords or result rows.
sqlHistory:
  enabled: false

# Explicit platform operators, exact private origins and public encryption keys
# are approved policy inputs. The API receives no private-key volume.
aiProviderManagement:
  enabled: false
  existingPublicSecret: ''
  existingPrivateSecret: ''
