{{- if .Values.ingress.enabled -}}
{{- $name := include "neonControl.name" . -}}
{{- $webService := printf "%s-web" $name -}}
{{- if not .Values.web.enabled -}}{{- $webService = printf "%s-api" $name -}}{{- end -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  {{- with .Values.ingress.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls: {{ toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host is required" .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: {{ $webService }}, port: {name: http}}
{{- end }}
