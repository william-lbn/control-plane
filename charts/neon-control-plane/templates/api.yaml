{{- $name := include "neonControl.name" . -}}
{{- if and (eq .Values.api.pgTLSMode "verify-full") (not .Values.api.pgCASecret) -}}
{{- fail "verify-full requires api.pgCASecret containing ca.crt; use lab-insecure only in an explicit laboratory override" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-api
  labels:
    {{- include "neonControl.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  revisionHistoryLimit: 5
  # An overlapping worker cannot be allowed before the distributed fence gate.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: api
        {{- include "neonControl.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}-api
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      terminationGracePeriodSeconds: 35
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: {{ required "api.image.reference is required" .Values.api.image.reference | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          ports: [{name: http, containerPort: 8788}]
          resources: {{ toYaml .Values.api.resources | nindent 12 }}
          env:
            - {name: NEON_V2_BIND, value: ':8788'}
            - {name: NEON_KUBE_NAMESPACE, value: {{ .Release.Namespace | quote }}}
            - {name: NEON_V2_CREATE_ENABLED, value: {{ .Values.api.creationEnabled | quote }}}
            - {name: NEON_V2_SCALE_ZERO_ENABLED, value: {{ .Values.api.scaleToZeroEnabled | quote }}}
            - {name: NEON_COOKIE_SECURE, value: {{ .Values.api.cookieSecure | quote }}}
            - {name: NEON_PROXY_HOST, value: {{ .Values.api.proxyHost | quote }}}
            - {name: NEON_PROXY_PORT, value: {{ .Values.api.proxyPort | quote }}}
            - {name: NEON_PUBLIC_PROXY_HOST, value: {{ .Values.api.publicProxyHost | quote }}}
            - {name: NEON_PUBLIC_PROXY_PORT, value: {{ .Values.api.publicProxyPort | quote }}}
            - {name: NEON_PG_TLS_MODE, value: {{ .Values.api.pgTLSMode | quote }}}
            - {name: NEON_VM_COMPUTE_IMAGE, value: {{ .Values.api.computeImage | quote }}}
            - {name: NEON_COMPUTE_GATEWAY_URL, value: {{ .Values.api.computeGatewayURL | quote }}}
            - {name: NEON_COMPUTE_CONTROL_HOST, value: {{ .Values.api.computeControlHost | quote }}}
            - {name: NEON_V2_ADMIN_PASSWORD_FILE, value: /run/neon-secrets/admin-password}
            - {name: NEON_V2_IDEMPOTENCY_KEY_FILE, value: /run/neon-secrets/idempotency-key}
            - name: NEON_V2_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.api.existingSecret }}, key: database-url}}
            {{- if .Values.api.pgCASecret }}
            - {name: NEON_PG_CA_FILE, value: /run/pg-ca/ca.crt}
            {{- end }}
          volumeMounts:
            - {name: credentials, mountPath: /run/neon-secrets, readOnly: true}
            {{- if .Values.api.pgCASecret }}
            - {name: pg-ca, mountPath: /run/pg-ca, readOnly: true}
            {{- end }}
          startupProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5, timeoutSeconds: 4, failureThreshold: 60}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 10, timeoutSeconds: 4, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 15, timeoutSeconds: 3, failureThreshold: 3}
      volumes:
        - name: credentials
          secret: {secretName: {{ .Values.api.existingSecret }}, defaultMode: 0440}
        {{- if .Values.api.pgCASecret }}
        - name: pg-ca
          secret: {secretName: {{ .Values.api.pgCASecret }}, defaultMode: 0440}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-api
spec:
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api}
  ports: [{name: http, port: 8788, targetPort: http}]
