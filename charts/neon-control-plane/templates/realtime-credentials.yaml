{{- define "neonControl.realtimeCredentialNamespace" -}}
{{- printf "%s-rtcred" (include "neonControl.name" . | trunc 56 | trimSuffix "-") -}}
{{- end -}}
{{- if .Values.realtime.enabled }}
{{- $name := include "neonControl.name" . }}
{{- $namespace := include "neonControl.realtimeCredentialNamespace" . }}
{{- if eq $namespace .Release.Namespace }}
{{- fail "Realtime credential namespace must differ from the platform workload namespace" }}
{{- end }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $namespace }}
  labels:
    app.kubernetes.io/part-of: neon-control
    app.kubernetes.io/component: realtime-credentials
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: realtime-api
  namespace: {{ $namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: realtime-api
  namespace: {{ $namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: realtime-api
subjects:
  - kind: ServiceAccount
    name: {{ $name }}-api
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: realtime-worker
  namespace: {{ $namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: realtime-worker
  namespace: {{ $namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: realtime-worker
subjects:
  - kind: ServiceAccount
    name: {{ $name }}-worker
    namespace: {{ .Release.Namespace }}
{{- end }}
