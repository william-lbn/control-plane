{{- if .Values.managedAuth.labMailbox.enabled }}
{{- if not (and .Values.managedAuth.mail.enabled .Values.managedAuth.labMailbox.acknowledged) }}
{{- fail "Local mail receiver requires Auth mail and explicit labMailbox.acknowledged" }}
{{- end }}
{{- $name := include "neonControl.name" . -}}
{{- $claim := default (printf "%s-auth-mailbox" $name) .Values.managedAuth.labMailbox.existingClaim -}}
{{- if not .Values.managedAuth.labMailbox.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $claim }}
  annotations: {helm.sh/resource-policy: keep}
  labels:
    {{- include "neonControl.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.managedAuth.labMailbox.storageClass }}
  storageClassName: {{ .Values.managedAuth.labMailbox.storageClass | quote }}
  {{- end }}
  resources: {requests: {storage: {{ .Values.managedAuth.labMailbox.storageSize }}}}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-auth-mailbox
  labels:
    {{- include "neonControl.labels" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: auth-mailbox}}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: auth-mailbox}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.managedAuth.labMailbox.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: mailbox
          image: {{ .Values.managedAuth.labMailbox.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          ports: [{name: smtp, containerPort: 1025}, {name: inbox, containerPort: 8025}]
          # Credentials are not present in values, environment or stdout.
          env:
            - {name: MP_UI_AUTH_FILE, value: /run/mailbox/authfile}
            - {name: MP_DATABASE, value: /data/mailpit.db}
            - {name: MP_MAX_MESSAGES, value: '0'}
            - {name: MP_DISABLE_HTML_CHECK, value: 'true'}
            - {name: MP_DISABLE_TLS_CHECK, value: 'true'}
            # No egress is allowed. Default reverse DNS stalls SMTP greeting.
            - {name: MP_SMTP_DISABLE_RDNS, value: 'true'}
            - {name: MP_DISABLE_VERSION_CHECK, value: 'true'}
            - {name: MP_BLOCK_REMOTE_CSS_AND_FONTS, value: 'true'}
            - {name: MP_MAX_MESSAGE_SIZE, value: '1'}
            - {name: MP_ALLOWED_HOSTS, value: {{ printf "neon-auth-mailbox,neon-auth-mailbox.%s.svc.cluster.local:8025" .Release.Namespace | quote }}}
          readinessProbe: {tcpSocket: {port: inbox}, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: inbox}, periodSeconds: 15}
          resources: {requests: {cpu: 25m, memory: 64Mi}, limits: {cpu: 250m, memory: 256Mi}}
          volumeMounts:
            - {name: auth, mountPath: /run/mailbox, readOnly: true}
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: auth
          secret:
            secretName: {{ required "Local mailbox requires an independent existingAuthSecret" .Values.managedAuth.labMailbox.existingAuthSecret }}
            defaultMode: 0440
            items: [{key: authfile, path: authfile}]
        - {name: data, persistentVolumeClaim: {claimName: {{ $claim }}}}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
---
apiVersion: v1
kind: Service
metadata:
  # Stable local test peer name. It is never exposed by NodePort or Ingress.
  name: neon-auth-mailbox
  labels:
    {{- include "neonControl.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: auth-mailbox}
  ports: [{name: smtp, port: 1025, targetPort: smtp}, {name: inbox, port: 8025, targetPort: inbox}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-auth-mailbox
spec:
  podSelector: {matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: auth-mailbox}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchExpressions: [{key: neon-control/managed-auth, operator: Exists}]}
      ports: [{port: 1025, protocol: TCP}]
    - from:
        - podSelector: {matchLabels: {neon-control/test-fixture: auth-mail}}
      ports: [{port: 8025, protocol: TCP}]
  # Local receiver must not fetch remote attachments, relay mail, or call DNS.
  egress: []
{{- end }}
