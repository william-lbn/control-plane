name: Trusted Linux live UI
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Real Linux UI acceptance slice
        type: choice
        options: [auth-magic-link.spec.ts, auth-otp.spec.ts, auth-mail.spec.ts, auth-security.spec.ts, s3-storage.spec.ts, native-product.spec.ts, restore.spec.ts, lifecycle.spec.ts, endpoint-deletion.spec.ts, data-api.spec.ts, backend-credentials.spec.ts, console-invitations.spec.ts, managed-auth.spec.ts, object-storage.spec.ts, functions-metadata.spec.ts, functions-native.spec.ts, functions-observation.spec.ts, functions-http.spec.ts, functions-wake.spec.ts, database-owner.spec.ts, sql-script.spec.ts, sql-tools.spec.ts, functions-rollback.spec.ts, ai-gateway.spec.ts, saved-queries.spec.ts]
        default: native-product.spec.ts
      additional_suite:
        description: Additional real UI suites (overrides suite when selected)
        type: choice
        options: [none, storage-directory.spec.ts, storage-copy.spec.ts, storage-bulk-delete.spec.ts, storage-presigned-upload.spec.ts, storage-browser-metadata.spec.ts, functions-request-logs.spec.ts, storage-metadata-edit.spec.ts]
        default: none
      poll_fault:
        description: Inject transient read failures for native/Data API observation recovery
        type: boolean
        default: true
      credential_project:
        description: Retained authorized test project for credentials or Functions metadata UI
        type: string
        required: false
permissions: {contents: read}
concurrency: {group: neon-live-ui, cancel-in-progress: false}
jobs:
  browser:
    # Register a dedicated Linux runner; never route untrusted PRs to it.
    runs-on: [self-hosted, Linux, X64, neon-e2e]
    environment: neon-live-e2e
    timeout-minutes: 40
    env:
      NEON_E2E_BASE_URL: ${{ vars.NEON_E2E_BASE_URL }}
      NEON_E2E_ATTEMPT: run-${{ github.run_id }}-${{ github.run_attempt }}
      NEON_E2E_EXPECT_SPLIT: 'true'
      NEON_E2E_POLL_FAULT: ${{ inputs.poll_fault && 'true' || 'false' }}
      NEON_E2E_SUITE: ${{ inputs.additional_suite != 'none' && inputs.additional_suite || inputs.suite }}
      NEON_E2E_CREDENTIAL_PROJECT: ${{ inputs.credential_project }}
      NEON_E2E_FUNCTIONS_MONITOR_FIXTURE: ${{ vars.NEON_E2E_FUNCTIONS_MONITOR_FIXTURE }}
      NEON_E2E_CATALOG_OWNER_FIXTURE: ${{ vars.NEON_E2E_CATALOG_OWNER_FIXTURE }}
      NEON_E2E_SQL_SCRIPT_FIXTURE: ${{ vars.NEON_E2E_SQL_SCRIPT_FIXTURE }}
      NEON_E2E_S3_PROBE: ${{ vars.NEON_E2E_S3_PROBE }}
      NEON_E2E_MAILBOX_FIXTURE: ${{ vars.NEON_E2E_MAILBOX_FIXTURE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24.19.0', cache: npm, cache-dependency-path: web/package-lock.json}
      - name: Resolve Linux runner paths
        shell: bash
        run: |
          task_run="run-$GITHUB_RUN_ID-a$GITHUB_RUN_ATTEMPT"
          {
            echo "NEON_E2E_ARTIFACTS=$RUNNER_TEMP/neon-ui-artifacts/$task_run"
            echo "NEON_E2E_PRIVATE_DIR=$RUNNER_TEMP/neon-ui-private/$task_run"
            echo "NEON_E2E_ADMIN_PASSWORD_FILE=$RUNNER_TEMP/neon-ui-private/$task_run/admin-password"
          } >> "$GITHUB_ENV"
      - name: Prepare protected credentials outside the checkout
        env: {ADMIN_PASSWORD: '${{ secrets.NEON_E2E_ADMIN_PASSWORD }}'}
        run: |
          test -n "$NEON_E2E_BASE_URL"
          test -n "$ADMIN_PASSWORD"
          case "$NEON_E2E_SUITE" in
            native-product.spec.ts|restore.spec.ts|lifecycle.spec.ts|endpoint-deletion.spec.ts|data-api.spec.ts|console-invitations.spec.ts|managed-auth.spec.ts|object-storage.spec.ts|functions-native.spec.ts) ;;
            functions-request-logs.spec.ts|functions-http.spec.ts|functions-observation.spec.ts|functions-wake.spec.ts|functions-rollback.spec.ts) test -f "$NEON_E2E_FUNCTIONS_MONITOR_FIXTURE" ;;
            database-owner.spec.ts) test -f "$NEON_E2E_CATALOG_OWNER_FIXTURE" ;;
            auth-security.spec.ts|s3-storage.spec.ts|storage-directory.spec.ts|storage-copy.spec.ts|storage-metadata-edit.spec.ts|storage-browser-metadata.spec.ts|storage-presigned-upload.spec.ts|storage-bulk-delete.spec.ts|sql-script.spec.ts|sql-tools.spec.ts) test -f "$NEON_E2E_SQL_SCRIPT_FIXTURE" ;;
            auth-magic-link.spec.ts|auth-otp.spec.ts|auth-mail.spec.ts) test -f "$NEON_E2E_SQL_SCRIPT_FIXTURE"; test -f "$NEON_E2E_MAILBOX_FIXTURE" ;;
            backend-credentials.spec.ts|functions-metadata.spec.ts|ai-gateway.spec.ts|saved-queries.spec.ts) [[ "$NEON_E2E_CREDENTIAL_PROJECT" =~ ^prj_[a-f0-9]{16}$ ]] ;;
            *) exit 1 ;;
          esac
          install -d -m 0700 "$NEON_E2E_PRIVATE_DIR"
          (umask 077; printf '%s' "$ADMIN_PASSWORD" > "$NEON_E2E_ADMIN_PASSWORD_FILE")
      - run: npm ci --no-audit --fund=false
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Package pinned Functions example outside the checkout
        if: (inputs.suite == 'functions-http.spec.ts' || inputs.additional_suite == 'functions-request-logs.spec.ts') || inputs.suite == 'functions-native.spec.ts' || inputs.suite == 'functions-observation.spec.ts' || inputs.suite == 'functions-wake.spec.ts' || inputs.suite == 'functions-rollback.spec.ts'
        run: |
          npm ci --prefix examples/functions/postgres --ignore-scripts --no-audit --fund=false
          node tools/package-function-example.mjs examples/functions/postgres "$NEON_E2E_PRIVATE_DIR/function-example.zip"
          echo "NEON_E2E_FUNCTION_ZIP=$NEON_E2E_PRIVATE_DIR/function-example.zip" >> "$GITHUB_ENV"
          if [ "$NEON_E2E_SUITE" = functions-http.spec.ts ] || [ "$NEON_E2E_SUITE" = functions-request-logs.spec.ts ]; then
            node tools/rebundle-function-example.mjs "$NEON_E2E_PRIVATE_DIR/function-example.zip" examples/functions/http/index.mjs "$NEON_E2E_PRIVATE_DIR/function-http.zip"
            echo "NEON_E2E_FUNCTION_ZIP=$NEON_E2E_PRIVATE_DIR/function-http.zip" >> "$GITHUB_ENV"
          fi
          if [ "$NEON_E2E_SUITE" = functions-rollback.spec.ts ]; then
            node tools/package-function-example.mjs examples/functions/replacement "$NEON_E2E_PRIVATE_DIR/function-replacement.zip"
            echo "NEON_E2E_FUNCTION_ROLLBACK_ZIP=$NEON_E2E_PRIVATE_DIR/function-replacement.zip" >> "$GITHUB_ENV"
          fi
      - run: npm run test:e2e -- "$NEON_E2E_SUITE"
        working-directory: web
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with: {name: live-ui-evidence, path: '${{ env.NEON_E2E_ARTIFACTS }}', retention-days: 30}
