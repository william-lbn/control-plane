worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  # Query strings, SQL, request bodies, credentials and cookies are excluded.
  log_format request '$request_method $uri $status $request_time';
  access_log /dev/stdout request;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  sendfile on;
  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 8m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; object-src 'none'; frame-ancestors 'none'" always;
    location = /healthz { access_log off; return 200 'ok\n'; }
    location = /readyz { access_log off; return 200 'ready\n'; }
    location ^~ /api/docs/assets/ { try_files $uri =404; }
    location ~ ^/(api/|auth/|data/v1/|storage/v1/) {
      # Helm supplies this upstream through a mounted configuration file.
      proxy_pass http://neon-control-api:8788;
      # NGINX supplies this singleton header for proxied and local errors.
      # Passing Go's identical header too produces invalid "nosniff, nosniff".
      # Keep upstream CSP: file responses additionally require its sandbox.
      proxy_hide_header X-Content-Type-Options;
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Referrer-Policy;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_connect_timeout 5s;
      proxy_read_timeout 200s;
      proxy_send_timeout 200s;
      proxy_next_upstream off;
      proxy_buffering off;
    }
    location / { try_files $uri $uri/ /index.html; }
  }
}
