{{- if .Values.worker.enabled -}}
{{- $name := include "neonControl.name" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}-worker
  labels:
    {{- include "neonControl.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-worker
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ $name }}-api}
subjects:
  - {kind: ServiceAccount, name: {{ $name }}-worker, namespace: {{ .Release.Namespace }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-worker-observer
  labels:
    {{- include "neonControl.labels" . | nindent 4 }}
rules:
  # Independent Endpoint retirement observes normal NeonVM Runner GC by
  # label selector. Kubernetes RBAC cannot scope list by labels; the Driver
  # verifies project/Endpoint ownership of every result before accepting it.
  # This role is namespace-scoped and grants no Pod mutation or deletion.
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-worker-observer
  labels:
    {{- include "neonControl.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ $name }}-worker-observer}
subjects:
  - {kind: ServiceAccount, name: {{ $name }}-worker, namespace: {{ .Release.Namespace }}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-worker
  labels:
    {{- include "neonControl.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicaCount }}
  revisionHistoryLimit: 5
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: worker}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: worker
        {{- include "neonControl.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}-worker
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      terminationGracePeriodSeconds: 35
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: worker
          image: {{ required "api.image.reference is required" .Values.api.image.reference | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          command: [/opt/neon-control/control-worker]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          ports:
            - {name: health, containerPort: 8789}
            {{- if .Values.functions.enabled }}
            - {name: artifact-tls, containerPort: 8790}
            {{- end }}
          resources: {{ toYaml .Values.worker.resources | nindent 12 }}
          env:
            {{- include "neonControl.providerEnv" (dict "root" . "private" true) | nindent 12 }}
            - {name: NEON_CONTROL_PROCESS_ROLE, value: worker}
            - {name: NEON_WORKER_BIND, value: ':8789'}
            {{- if .Values.backendCredentials.enabled }}
            - {name: NEON_BACKEND_CREDENTIAL_KEYS_FILE, value: /run/backend-keys/keyring.json}
            {{- end }}
            {{- include "neonControl.runtimeEnv" . | nindent 12 }}
            {{- include "neonControl.storageCapacityEnv" . | nindent 12 }}
          volumeMounts:
            {{- include "neonControl.providerMounts" (dict "root" . "private" true) | nindent 12 }}
            {{- include "neonControl.functionsMounts" . | nindent 12 }}
            {{- if .Values.functions.enabled }}
            - {name: functions-issuer, mountPath: /run/functions-issuer, readOnly: true}
            {{- end }}
            {{- if .Values.objectStorage.enabled }}
            - {name: product-storage, mountPath: /run/product-storage, readOnly: true}
            {{- end }}
            - {name: credentials, mountPath: /run/neon-secrets, readOnly: true}
            {{- if .Values.backendCredentials.enabled }}
            - {name: backend-keys, mountPath: /run/backend-keys, readOnly: true}
            {{- end }}
            {{- if .Values.api.pgCASecret }}
            - {name: pg-ca, mountPath: /run/pg-ca, readOnly: true}
            {{- end }}
          startupProbe: {httpGet: {path: /healthz, port: health}, periodSeconds: 5, timeoutSeconds: 4, failureThreshold: 60}
          readinessProbe: {httpGet: {path: /readyz, port: health}, periodSeconds: 5, timeoutSeconds: 4, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /healthz, port: health}, periodSeconds: 15, timeoutSeconds: 3, failureThreshold: 3}
      volumes:
        {{- include "neonControl.providerVolumes" (dict "root" . "private" true) | nindent 8 }}
        {{- include "neonControl.functionsVolumes" . | nindent 8 }}
        {{- if .Values.functions.enabled }}
        - name: functions-issuer
          secret:
            secretName: {{ required "functions.existingIssuerSecret is required" .Values.functions.existingIssuerSecret }}
            defaultMode: 0440
            items:
              - {key: guest-ca.key, path: guest-ca.key}
              - {key: artifact-tls.crt, path: artifact-tls.crt}
              - {key: artifact-tls.key, path: artifact-tls.key}
        {{- end }}
        {{- if .Values.objectStorage.enabled }}
        - name: product-storage
          secret:
            secretName: {{ required "objectStorage.existingSecret is required" .Values.objectStorage.existingSecret }}
            defaultMode: 0440
            items: [{key: config.json, path: config.json}]
        {{- end }}
        - name: credentials
          secret:
            secretName: {{ .Values.api.existingSecret }}
            defaultMode: 0440
            items: [{key: idempotency-key, path: idempotency-key}]
        {{- if .Values.backendCredentials.enabled }}
        - name: backend-keys
          secret:
            secretName: {{ required "backendCredentials.existingSecret is required" .Values.backendCredentials.existingSecret }}
            defaultMode: 0440
            items: [{key: keyring.json, path: keyring.json}]
        {{- end }}
        {{- if .Values.api.pgCASecret }}
        - name: pg-ca
          secret: {secretName: {{ .Values.api.pgCASecret }}, defaultMode: 0440}
        {{- end }}
{{- end }}
